{% extends 'base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'flashcards/card_detail.css' %}">
{% endblock %}

{% block main %}
<article class="card-detail">
    <section class="card-detail__section">
        <h1 class="card-detail__label">Front</h1>
        <p class="card-detail__content">{{ card.front }}</p>
    </section>

    <section class="card-detail__section">
        <h2 class="card-detail__label">Back</h2>
        <p class="card-detail__content">{{ card.back }}</p>
    </section>

    <div class="card-detail__actions">
        <a href="{% url 'deck-detail' card.deck.pk %}">Back to deck</a>
        <a href="{% url 'card-update' card.pk %}">Edit card</a>
        <a href="{% url 'card-delete' card.pk %}">Delete card</a>
    </div>
</article>
{% endblock %}
