{% extends 'base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'flashcards/decks.css' %}">
{% endblock %}

{% block main %}
<h1>My Decks</h1>
<p>
    <a href="{% url 'deck-create' %}">+ New Deck</a>
</p>

{% if decks %}
<div class="deck-grid">
    {% for deck in decks %}
        <a 
        class="deck-tile" 
        href="{% url 'deck-detail' deck.pk %}"
        >
        <span class="deck-tile__name">{{ deck.name }}</span>
        <span class="deck-tile__card-count">{{ deck.cards.count }} cards</span>
        </a>
    {% endfor %}
</div>
{% else %}
<p>No decks yet.</p>
{% endif %}
{% endblock %}
