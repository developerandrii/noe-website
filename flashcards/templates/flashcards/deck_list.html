{% load static %}

<link rel="stylesheet" href="{% static 'flashcards/decks.css' %}">

<h1>My Decks</h1>
<p>
    <a href="{% url 'deck-create' %}">+ New Deck</a>
</p>

{% if decks %}
<div class="deck-grid">
    {% for deck in decks %}
        <div class="deck-tile">
            <a href="{% url 'deck-detail' deck.pk %}">{{ deck.name }}</a>
        </div>
    {% endfor %}
</div>
{% else %}
<p>No decks yet.</p>
{% endif %}
