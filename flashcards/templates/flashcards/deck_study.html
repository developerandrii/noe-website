{% extends 'base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'flashcards/deck_study.css' %}">
{% endblock %}

{% block main %}
<h1>Study {{ deck.name }}</h1>

{% if card %}
    <article>
        <p>{{ card.front }}</p>
    </article>
{% else %}
    <p>This deck has no cards yet.</p>
    <a href="{% url 'card-create' deck.pk %}">Add first card</a>
{% endif %}

<a href="{% url 'deck-detail' deck.pk %}">Back to deck</a>
{% endblock %}
