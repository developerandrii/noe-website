<h1>{{ deck.name }}</h1>

<p>Created: {{ deck.created_at }}</p>

<a href="{% url 'card-create' deck.pk %}">Add Card</a>
<br>
<a href="{% url 'deck-update' deck.pk %}">Edit Deck</a>

<h2>Cards</h2>

<ul>
    {% for card in deck.cards.all %}
        <li>{{ card.front }}</li>
    {% empty %}
        <li>No cards yet.</li>
    {% endfor %}
</ul>
