{% extends 'base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'accounts/auth.css' %}">
{% endblock %}

{% block main %}
<h1 class="auth-title">Log in</h1>

<form class="auth-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
        Log in
    </button>
</form>
{% endblock %}
